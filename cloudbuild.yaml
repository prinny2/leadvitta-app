# Deploy do LeadBellus no Cloud Run.
# Uso: gcloud builds submit --config cloudbuild.yaml
# Ajuste as substitutions para o seu projeto (confirme = onde o Núcleo já roda).
# Segredos (ANTHROPIC_API_KEY etc.) NÃO ficam aqui — configure no serviço Cloud Run:
#   gcloud run services update $_SERVICE --region $_REGION \
#     --set-env-vars NEXT_PUBLIC_SITE_URL=https://SEU-SERVICO.run.app \
#     --set-secrets ANTHROPIC_API_KEY=anthropic-api-key:latest

substitutions:
  _REGION: southamerica-east1
  _SERVICE: leadbellus
  _REPO: leadbellus
  # NEXT_PUBLIC_* são PÚBLICOS e build-time. Passe os valores no submit:
  #   gcloud builds submit --config cloudbuild.yaml --substitutions=\
  #     _NEXT_PUBLIC_FIREBASE_API_KEY=AIza...,\
  #     _NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=leadvitta-app.firebaseapp.com,\
  #     _NEXT_PUBLIC_FIREBASE_PROJECT_ID=leadvitta-app,\
  #     _NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=leadvitta-app.firebasestorage.app,\
  #     _NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=87102725202,\
  #     _NEXT_PUBLIC_FIREBASE_APP_ID=1:8710...:web:...,\
  #     _NEXT_PUBLIC_SITE_URL=https://leadbellus.com.br,\
  #     _NEXT_PUBLIC_META_PIXEL_ID=917448661312985
  _NEXT_PUBLIC_FIREBASE_API_KEY: ""
  _NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ""
  _NEXT_PUBLIC_FIREBASE_PROJECT_ID: ""
  _NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ""
  _NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ""
  _NEXT_PUBLIC_FIREBASE_APP_ID: ""
  _NEXT_PUBLIC_SITE_URL: ""
  _NEXT_PUBLIC_META_PIXEL_ID: ""
  _NEXT_PUBLIC_GA4_ID: ""

steps:
  # 1) Build da imagem — injeta as NEXT_PUBLIC_* (build-time) via --build-arg
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --build-arg=NEXT_PUBLIC_FIREBASE_API_KEY=${_NEXT_PUBLIC_FIREBASE_API_KEY}
      - --build-arg=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
      - --build-arg=NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_NEXT_PUBLIC_FIREBASE_PROJECT_ID}
      - --build-arg=NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
      - --build-arg=NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
      - --build-arg=NEXT_PUBLIC_FIREBASE_APP_ID=${_NEXT_PUBLIC_FIREBASE_APP_ID}
      - --build-arg=NEXT_PUBLIC_SITE_URL=${_NEXT_PUBLIC_SITE_URL}
      - --build-arg=NEXT_PUBLIC_META_PIXEL_ID=${_NEXT_PUBLIC_META_PIXEL_ID}
      - --build-arg=NEXT_PUBLIC_GA4_ID=${_NEXT_PUBLIC_GA4_ID}
      - .

  # 2) Push para o Artifact Registry
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA

  # 3) Deploy no Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:502.0.0  # pinado p/ build reproduzível
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
